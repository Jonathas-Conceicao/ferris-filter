[package]
name = "ferrisfilter"
version = "0.7.0-rc.1"
edition = "2024"
default-run = "ff"
repository = "https://github.com/Jonathas-Conceicao/ferris-filter"
license = "GPL-3.0-or-later"

[workspace]
members = [".", "tools/ff-art"]
default-members = ["."]
resolver = "3"

[lib]
name = "ferrisfilter"
path = "src/lib.rs"

[[bin]]
name = "ferrisfilter"
path = "src/main.rs"

[[bin]]
name = "ff"
path = "src/bin/ff.rs"

[[bin]]
name = "ff-cli"
path = "src/bin/ff-cli.rs"

[dependencies]
clap    = { version = "4.6", features = ["derive"] }
serde   = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
serde_path_to_error = "0.1"
miette  = { version = "7.6", features = ["fancy"] }
thiserror           = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", features = ["ring"] }
tokio   = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
semver = "1"
ring = "0.17"
dirs = "6"
eframe  = "0.36"
egui    = "0.36"
global-hotkey = "0.8"
tray-icon = "0.24"
image   = { version = "0.25", default-features = false, features = ["png"] }
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Time", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
rfd = { version = "0.17", default-features = false }

[dev-dependencies]
assert_cmd  = "2.2"
predicates  = "3.1"
insta       = "1.47.2"

# Optimise dependencies (egui/epaint/ab_glyph font rasterising) in debug and test builds:
# the overlay tests render with the real Fontin fonts, which is very slow unoptimised.
# Our own crate stays at opt-level 0 for debugging.
# Exe icon and version info for ff.exe only (see build.rs).
[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[profile.dev.package."*"]
opt-level = 2

# Release builds (the shipped binaries): whole-program optimisation, one codegen unit, no
# debug symbols. Slower to build, smaller and faster to run.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
