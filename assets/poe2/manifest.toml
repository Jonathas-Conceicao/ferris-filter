# ff-art manifest: which Path of Exile 2 files are extracted into assets/poe2/.
#
# Run `cargo ff-art` (see tools/ff-art/README.md) after a game patch to
# refresh every file listed here. The art belongs to Grinding Gear Games; see README.md.
#
# [[image]] fields:
#   path       game virtual path of the base-resolution .dds (case does not matter)
#   out        output PNG, relative to assets/poe2/
#   prefer_4k  use the `4K/` sibling when the game has one (crisper on high-DPI screens)
#   trim       drop the transparent right/bottom gutter the game's textures carry
#   crop       [x, y, w, h] in the pixels of the image actually used (after trim)
#   clear      [[x, y, w, h], ...] regions made transparent after cropping
#
# Find more paths with `ff-art list <pattern>`, eyeball them with `ff-art dump` + `ff-art sheet`.

# --- Options window (Art/Textures/Interface/2D/2DArt/UIImages/InGame/OptionsMenu, "Options Menu")

# The ornate header (angels, hooded figure, gold title plate). No 4K variant exists.
[[image]]
path = "art/textures/interface/2d/2dart/uiimages/ingame/options menu/titlebar.dds"
out = "options/titlebar.png"
trim = true

# The whole Options page: stone frame, thin gold inner border, recessed button bar at the
