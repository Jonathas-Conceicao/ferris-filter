# Pull-request checks. Workflows run on version tags (release.yml) and on pull
# requests only; push-to-main runs are deferred. The floating nightly from
# rust-toolchain.toml is accepted by the author.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc -vV

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run the tests
        run: cargo test --locked
