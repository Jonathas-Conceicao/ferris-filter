# --- Ferris background (rendered from the committed SVG; no game install needed).
# A pale white line drawing for a 660px-wide, full-height window, at 2x for crispness.
[ferris]
svg = "assets/ferris/rustacean-flat-happy.svg"
out = "assets/ui/ferris-bg.png"
width = 1200
height = 2000
crab_fraction = 0.8
crab_center_y = 0.5
line_alpha = 34
line_radius = 2

# Orange Ferris for the ABOUT tab (original colours, rendered from the committed SVG; no game
# install needed). 3x of the 112pt it is drawn at.
[ferris_about]
svg = "assets/ferris/rustacean-flat-happy.svg"
out = "assets/ui/ferris-about.png"
width = 336

# Multi-size Windows icon for ff.exe, the installer and the Start menu (original colours, square
# crop around the artwork; rendered from the committed SVG, no game install needed).
[ferris_icon]
svg = "assets/ferris/rustacean-flat-happy.svg"
out = "assets/ferris/ferris.ico"
sizes = [16, 24, 32, 48, 64, 128, 256]
