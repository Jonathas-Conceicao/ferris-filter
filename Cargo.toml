[package]
name = "ferrisfilter"
version = "0.1.0"
edition = "2024"
default-run = "ff"

[[bin]]
name = "ferrisfilter"
path = "src/main.rs"

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
clap    = { version = "4.6", features = ["derive"] }
serde   = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
serde_path_to_error = "0.1"
miette  = { version = "7.6", features = ["fancy"] }
thiserror           = "2.0"

[dev-dependencies]
assert_cmd  = "2.2"
predicates  = "3.1"
insta       = "1.47.2"
