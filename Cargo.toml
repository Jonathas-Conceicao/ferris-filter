[package]
name = "ferrisfilter"
version = "0.1.0"
edition = "2024"
default-run = "ff"

[lib]
name = "ferrisfilter"
path = "src/lib.rs"

[[bin]]
name = "ferrisfilter"
path = "src/main.rs"

[[bin]]
name = "ff"
path = "src/bin/ff.rs"

[[bin]]
name = "seed_prices"
path = "src/bin/seed_prices.rs"

[[bin]]
name = "ff-cli"
path = "src/bin/ff-cli.rs"

[dependencies]
clap    = { version = "4.6", features = ["derive"] }
serde   = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
serde_path_to_error = "0.1"
miette  = { version = "7.6", features = ["fancy"] }
thiserror           = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", features = ["ring"] }
tokio   = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
eframe  = "0.36"
egui    = "0.36"
global-hotkey = "0.8"
tray-icon = "0.24"
image   = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
assert_cmd  = "2.2"
predicates  = "3.1"
insta       = "1.47.2"
